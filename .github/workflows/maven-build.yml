# Reusable build for one Maven project folder. Called by the per-project workflows.
name: maven-build

on:
  workflow_call:
    inputs:
      project:
        description: Project folder to build
        required: true
        type: string
      compose-file:
        description: Optional compose file (relative to project) started before tests
        required: false
        type: string
        default: ""
      build-command:
        description: Build command (projects without a Maven wrapper use mvn)
        required: false
        type: string
        default: ./mvnw -B verify

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ inputs.project }}/pom.xml

      - name: Start dependencies
        if: inputs.compose-file != ''
        run: |
          docker compose -f ${{ inputs.compose-file }} up -d
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 --silent && exit 0
            sleep 2
          done
          echo "MySQL did not start" && exit 1

      - name: Build and test
        run: ${{ inputs.build-command }}
